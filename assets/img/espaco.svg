<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Ilustração de um salão de açaíteria com mesas, balcão, luminárias e letreiro em neon">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E1446"/><stop offset="1" stop-color="#48216B"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9D9C2"/><stop offset="1" stop-color="#D4BE9F"/></linearGradient>
<linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8D900"/><stop offset="1" stop-color="#E2C400"/></linearGradient>
<radialGradient id="cone" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#FFE98A" stop-opacity=".55"/><stop offset="1" stop-color="#FFE98A" stop-opacity="0"/></radialGradient>
<radialGradient id="tbl" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8DDF0"/></radialGradient>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
<pattern id="tiles" width="80" height="40" patternUnits="userSpaceOnUse"><path d="M0 40 L80 40 M40 0 L40 40" stroke="#C9B08E" stroke-width="2" opacity=".5"/></pattern>
<pattern id="wainscot" width="36" height="200" patternUnits="userSpaceOnUse"><rect width="36" height="200" fill="#5A2C82"/><rect x="0" width="4" height="200" fill="#3E1B5C"/></pattern>
</defs>

<!-- parede e piso -->
<rect width="1200" height="520" fill="url(#wall)"/>
<rect y="380" width="1200" height="140" fill="url(#wainscot)"/>
<rect y="372" width="1200" height="12" fill="#D7A8FF" opacity=".5"/>
<rect y="520" width="1200" height="280" fill="url(#floor)"/>
<rect y="520" width="1200" height="280" fill="url(#tiles)"/>
<rect y="516" width="1200" height="8" fill="#241038" opacity=".35"/>

<!-- janela grande -->
<g transform="translate(70 90)">
  <rect width="250" height="230" rx="14" fill="#1A0B2A"/>
  <rect x="12" y="12" width="226" height="206" rx="8" fill="#7FB8E6"/>
  <rect x="12" y="140" width="226" height="78" fill="#5C9E5A"/>
  <circle cx="190" cy="60" r="26" fill="#FFF3B0"/>
  <path d="M12 150 Q70 120 130 148 T238 140 V218 H12Z" fill="#4A8A48"/>
  <rect x="121" y="12" width="8" height="206" fill="#1A0B2A"/>
  <rect x="12" y="110" width="226" height="8" fill="#1A0B2A"/>
</g>

<!-- letreiro neon -->
<g filter="url(#glow)">
  <rect x="430" y="70" width="340" height="140" rx="70" fill="none" stroke="#D7A8FF" stroke-width="6"/>
  <text x="532" y="168" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="78" fill="#F8D900" letter-spacing="-4">JM</text>
  <text x="660" y="164" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="64" fill="#FFF9F0">açaí</text>
</g>

<!-- quadro de menu -->
<g transform="translate(860 92)">
  <rect width="270" height="210" rx="12" fill="#170A24" stroke="#D7A8FF" stroke-width="4"/>
  <rect x="24" y="26" width="120" height="14" rx="7" fill="#F8D900"/>
  <rect x="24" y="62" width="200" height="8" rx="4" fill="#FFF9F0" opacity=".7"/>
  <rect x="24" y="86" width="170" height="8" rx="4" fill="#FFF9F0" opacity=".7"/>
  <rect x="24" y="110" width="186" height="8" rx="4" fill="#FFF9F0" opacity=".7"/>
  <rect x="24" y="144" width="96" height="14" rx="7" fill="#D7A8FF"/>
  <rect x="24" y="174" width="150" height="8" rx="4" fill="#FFF9F0" opacity=".7"/>
  <circle cx="226" cy="168" r="22" fill="#F8D900"/>
</g>

<!-- luminárias -->
<g>
  <path d="M360 0 V96" stroke="#170A24" stroke-width="3"/><path d="M332 96 h56 l-10 26 h-36z" fill="#F8D900"/>
  <path d="M600 0 V230" stroke="#170A24" stroke-width="3"/><path d="M572 230 h56 l-10 26 h-36z" fill="#F8D900"/>
  <path d="M840 0 V330" stroke="#170A24" stroke-width="3"/><path d="M812 330 h56 l-10 26 h-36z" fill="#F8D900"/>
  <path d="M346 122 L250 520 H470 L374 122Z" fill="url(#cone)"/>
  <path d="M586 256 L480 640 H720 L614 256Z" fill="url(#cone)"/>
  <path d="M826 356 L740 640 H940 L854 356Z" fill="url(#cone)"/>
</g>

<!-- balcão -->
<g transform="translate(820 360)">
  <rect x="0" y="0" width="380" height="24" fill="#FFF9F0"/>
  <rect x="10" y="24" width="370" height="190" fill="url(#counter)"/>
  <rect x="10" y="24" width="370" height="20" fill="#241038" opacity=".18"/>
  <g fill="#241038" opacity=".9"><rect x="40" y="70" width="12" height="120" rx="6"/><rect x="100" y="70" width="12" height="120" rx="6"/><rect x="160" y="70" width="12" height="120" rx="6"/><rect x="220" y="70" width="12" height="120" rx="6"/><rect x="280" y="70" width="12" height="120" rx="6"/><rect x="340" y="70" width="12" height="120" rx="6"/></g>
  <!-- copos no balcão -->
  <path d="M60 -46 h36 l-5 46 h-26z" fill="#FFFFFF" opacity=".9"/><ellipse cx="78" cy="-46" rx="20" ry="8" fill="#5B2A7E"/>
  <path d="M120 -40 h30 l-4 40 h-22z" fill="#FFFFFF" opacity=".9"/><ellipse cx="135" cy="-40" rx="17" ry="7" fill="#5B2A7E"/><circle cx="135" cy="-48" r="6" fill="#E0213A"/>
  <rect x="250" y="-70" width="70" height="70" rx="10" fill="#170A24"/><rect x="260" y="-60" width="50" height="34" rx="4" fill="#D7A8FF"/>
</g>

<!-- planta -->
<g transform="translate(40 410)">
  <path d="M30 120 h80 l-10 80 h-60z" fill="#F8D900"/>
  <g fill="#3E8E3A"><path d="M70 120 C20 90 10 40 30 10 C50 50 70 80 70 120Z"/><path d="M70 120 C120 90 130 30 110 0 C90 40 72 80 70 120Z"/><path d="M70 120 C40 70 60 20 75 -10 C85 30 80 80 70 120Z"/></g>
  <g fill="#59B455"><path d="M70 120 C0 110 -10 70 0 50 C30 80 50 100 70 120Z"/><path d="M70 120 C140 110 150 70 140 50 C110 80 90 100 70 120Z"/></g>
</g>

<!-- mesas e cadeiras -->
<g>
  <!-- mesa 1 -->
  <ellipse cx="290" cy="700" rx="130" ry="20" fill="#241038" opacity=".2" filter="url(#soft)"/>
  <rect x="150" y="560" width="22" height="130" rx="8" fill="#48216B"/><rect x="138" y="550" width="70" height="18" rx="8" fill="#7B3FB0"/>
  <rect x="408" y="560" width="22" height="130" rx="8" fill="#48216B"/><rect x="372" y="550" width="70" height="18" rx="8" fill="#7B3FB0"/>
  <rect x="280" y="600" width="20" height="96" fill="#241038"/><ellipse cx="290" cy="696" rx="50" ry="10" fill="#241038"/>
  <ellipse cx="290" cy="598" rx="110" ry="26" fill="url(#tbl)"/>
  <path d="M250 560 h32 l-4 34 h-24z" fill="#fff"/><ellipse cx="266" cy="560" rx="18" ry="7" fill="#5B2A7E"/><circle cx="262" cy="554" r="5" fill="#F6E3A1"/>
  <path d="M310 566 h28 l-4 30 h-20z" fill="#fff"/><ellipse cx="324" cy="566" rx="16" ry="6" fill="#5B2A7E"/><circle cx="328" cy="560" r="5" fill="#E0213A"/>
  <!-- mesa 2 -->
  <ellipse cx="640" cy="740" rx="140" ry="20" fill="#241038" opacity=".2" filter="url(#soft)"/>
  <rect x="492" y="600" width="24" height="136" rx="8" fill="#48216B"/><rect x="480" y="590" width="74" height="18" rx="8" fill="#7B3FB0"/>
  <rect x="766" y="600" width="24" height="136" rx="8" fill="#48216B"/><rect x="730" y="590" width="74" height="18" rx="8" fill="#7B3FB0"/>
  <rect x="630" y="642" width="20" height="96" fill="#241038"/><ellipse cx="640" cy="738" rx="54" ry="10" fill="#241038"/>
  <ellipse cx="640" cy="640" rx="122" ry="28" fill="url(#tbl)"/>
  <path d="M590 598 h36 l-5 38 h-26z" fill="#fff"/><ellipse cx="608" cy="598" rx="20" ry="8" fill="#5B2A7E"/><circle cx="604" cy="591" r="6" fill="#F6E3A1"/><circle cx="614" cy="593" r="5" fill="#E0213A"/>
  <g transform="translate(660 600)"><ellipse cx="22" cy="30" rx="30" ry="8" fill="#E8DDF0"/><path d="M0 18 Q22 -6 44 18Z" fill="#D9A35E"/><rect x="0" y="18" width="44" height="6" fill="#F8D900"/><rect x="0" y="23" width="44" height="7" fill="#5A3220"/><path d="M0 30 h44 q-4 8 -22 8 q-18 0 -22 -8z" fill="#D9A35E"/></g>
  <!-- mesa 3 (parcial, à direita) -->
  <ellipse cx="1030" cy="760" rx="120" ry="18" fill="#241038" opacity=".2" filter="url(#soft)"/>
  <rect x="900" y="630" width="24" height="126" rx="8" fill="#48216B"/><rect x="888" y="620" width="74" height="18" rx="8" fill="#7B3FB0"/>
  <rect x="1020" y="672" width="20" height="86" fill="#241038"/><ellipse cx="1030" cy="758" rx="50" ry="10" fill="#241038"/>
  <ellipse cx="1030" cy="670" rx="110" ry="26" fill="url(#tbl)"/>
  <rect x="1050" y="628" width="26" height="38" rx="6" fill="#F8D900"/><rect x="1050" y="640" width="26" height="12" fill="#241038"/>
</g>
</svg>
